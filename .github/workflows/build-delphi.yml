name: Build Delphi EXEs (self-hosted, manual)

# Manual only: needs a self-hosted Windows runner labelled "delphi" with
# RAD Studio installed. Without one, the job just sits in the queue.
# The automatic build is .github/workflows/build-fast.yml.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Win32 and Win64
    runs-on: [self-hosted, Windows, X64, delphi]
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Build Release executables
        shell: cmd
        env:
          DELPHI_STUDIO_DIR: ${{ vars.DELPHI_STUDIO_DIR }}
        run: |
          @echo off
          if not defined DELPHI_STUDIO_DIR (
            echo Missing repository Actions variable DELPHI_STUDIO_DIR.
            exit /b 1
          )
          if not exist "%DELPHI_STUDIO_DIR%\bin\rsvars.bat" (
            echo Could not find "%DELPHI_STUDIO_DIR%\bin\rsvars.bat".
            exit /b 1
          )

          call "%DELPHI_STUDIO_DIR%\bin\rsvars.bat"
          if errorlevel 1 exit /b 1

          msbuild "src\DeviceSetup\DeviceSetup.dproj" /t:Build /p:Config=Release /p:Platform=Win32 /verbosity:minimal
          if errorlevel 1 exit /b 1

          msbuild "src\DeviceSetup\DeviceSetup.dproj" /t:Build /p:Config=Release /p:Platform=Win64 /verbosity:minimal
          if errorlevel 1 exit /b 1

          if not exist "src\DeviceSetup\Win32\Release\DeviceSetup.exe" (
            echo Win32 EXE was not produced.
            exit /b 1
          )
          if not exist "src\DeviceSetup\Win64\Release\DeviceSetup.exe" (
            echo Win64 EXE was not produced.
            exit /b 1
          )

          python "src\DeviceSetup\tools\package_app.py" --exe "src\DeviceSetup\Win32\Release\DeviceSetup.exe" --output "artifacts\package-Win32" --archive "artifacts\DeviceSetup-Win32.zip"
          if errorlevel 1 exit /b 1
          python "src\DeviceSetup\tools\package_app.py" --exe "src\DeviceSetup\Win64\Release\DeviceSetup.exe" --output "artifacts\package-Win64" --archive "artifacts\DeviceSetup-Win64.zip"
          if errorlevel 1 exit /b 1

      - name: Upload both portable bundles
        uses: actions/upload-artifact@v5
        with:
          name: DeviceSetup-${{ github.sha }}
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 30
