name: Build EXEs (fast)

# Builds the app on GitHub-hosted Windows runners with the free Lazarus /
# Free Pascal compiler - no self-hosted runner or Delphi licence needed.
# Lazarus is cached after the first run, so later runs only compile.
# Every build runs "DeviceSetup.exe --selftest" (forms load, checks pass,
# screenshots of the screens are uploaded). Pushes to main publish the EXEs
# as the "Latest build" release; pushing a tag like v1.1.0 publishes a
# versioned release.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Win64
            cpu_os: x86_64-win64
            installer: "Lazarus%20Windows%2064%20bits/Lazarus%204.4/lazarus-4.4-fpc-3.2.2-win64.exe"
          - platform: Win32
            cpu_os: i386-win32
            installer: "Lazarus%20Windows%2032%20bits/Lazarus%204.4/lazarus-4.4-fpc-3.2.2-win32.exe"
    defaults:
      run:
        working-directory: Delphi/DeviceSetup
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Restore cached Lazarus
        id: lazcache
        uses: actions/cache@v4
        with:
          path: C:\lazarus
          key: lazarus-4.4-${{ matrix.platform }}-v2

      - name: Install Lazarus 4.4 (first run only)
        if: steps.lazcache.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $url = "https://downloads.sourceforge.net/project/lazarus/${{ matrix.installer }}"
          curl.exe -L --fail --retry 5 --retry-delay 5 -o lazarus-setup.exe $url
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::Lazarus download failed"; exit 1 }
          Start-Process -Wait -FilePath .\lazarus-setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/DIR=C:\lazarus'
          if (-not (Test-Path C:\lazarus\lazbuild.exe)) { Write-Output "::error::lazbuild.exe not found after install"; exit 1 }

      - name: Generate .lfm forms from .dfm
        shell: pwsh
        run: python tools/dfm2lfm.py

      - name: Stamp build id (shown in Help)
        shell: pwsh
        run: |
          $id = "${{ github.sha }}".Substring(0, 7) + " #${{ github.run_number }}"
          Set-Content -Path BuildInfo.inc -Value "CAppBuild = '$id';" -Encoding ascii
          Get-Content BuildInfo.inc

      - name: Compile
        shell: pwsh
        run: |
          & C:\lazarus\lazbuild.exe --build-all --lazarusdir=C:\lazarus DeviceSetup.lpi *>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            # surface compiler errors as annotations
            Select-String -Path build.log -Pattern 'Error|Fatal' | Select-Object -First 20 | ForEach-Object { Write-Output "::error::$($_.Line)" }
            exit 1
          }
          $exe = "lazbuild-out\${{ matrix.cpu_os }}\DeviceSetup.exe"
          if (-not (Test-Path $exe)) { Write-Error "EXE not produced: $exe"; exit 1 }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item $exe "artifacts\DeviceSetup-${{ matrix.platform }}.exe"
          Get-Item "artifacts\*.exe" | Format-Table Name, Length

      - name: Self-test (forms load, checks pass, screenshots)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force selftest-run | Out-Null
          Copy-Item "artifacts\DeviceSetup-${{ matrix.platform }}.exe" selftest-run\DeviceSetup.exe
          $p = Start-Process -FilePath selftest-run\DeviceSetup.exe -ArgumentList '--selftest' -PassThru
          $null = $p.Handle
          $timedOut = -not $p.WaitForExit(120000)
          New-Item -ItemType Directory -Force selftest-run\selftest | Out-Null
          Add-Type -AssemblyName System.Drawing, System.Windows.Forms
          if ($timedOut) {
            # something (usually an error dialog) blocked the app: grab the screen
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $shot = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($shot).CopyFromScreen($b.Left, $b.Top, 0, 0, $shot.Size)
            $shot.Save("$PWD\selftest-run\selftest\timeout-screen.png")
            Stop-Process -Id $p.Id -Force
          }
          Get-ChildItem selftest-run\selftest\*.bmp -ErrorAction SilentlyContinue | ForEach-Object {
            $img = [System.Drawing.Image]::FromFile($_.FullName)
            $img.Save(($_.FullName -replace '\.bmp$', '.png'), [System.Drawing.Imaging.ImageFormat]::Png)
            $img.Dispose()
            Remove-Item $_.FullName
          }
          $log = 'selftest-run\selftest\selftest.log'
          if (Test-Path $log) { Get-Content $log }
          if ($timedOut) { Write-Output "::error::Self-test did not finish (probably blocked by an error dialog - see timeout-screen.png)"; exit 1 }
          if (($p.ExitCode -ne 0) -or -not (Test-Path $log) -or -not (Select-String -Path $log -Pattern 'SELFTEST OK' -Quiet)) {
            Write-Output "::error::Self-test failed (exit code $($p.ExitCode))"
            exit 1
          }

      - name: Upload self-test results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DeviceSetup-selftest-${{ matrix.platform }}-${{ github.sha }}
          path: Delphi/DeviceSetup/selftest-run/selftest/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: DeviceSetup-${{ matrix.platform }}-${{ github.sha }}
          path: Delphi/DeviceSetup/artifacts/*.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download EXEs
        uses: actions/download-artifact@v4
        with:
          pattern: DeviceSetup-Win*-${{ github.sha }}
          merge-multiple: true
          path: exe

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l exe
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            gh release create "$tag" exe/*.exe --verify-tag \
              --title "Mobile Servicing Tools $tag" --generate-notes
          else
            gh release delete latest-build --yes --cleanup-tag 2>/dev/null || true
            gh release create latest-build exe/*.exe --target "$GITHUB_SHA" --latest \
              --title "Latest build (main)" \
              --notes "Built from ${GITHUB_SHA::7} on main. Download DeviceSetup-Win64.exe (64-bit Windows) or DeviceSetup-Win32.exe (32-bit). This release is replaced on every push to main."
          fi
