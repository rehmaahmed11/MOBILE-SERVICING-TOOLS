name: Build EXEs (fast)

# Builds the app on GitHub-hosted Windows runners with the free Lazarus /
# Free Pascal compiler - no self-hosted runner or Delphi licence needed.
# Lazarus is cached after the first run, so later runs only compile.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Win64
            cpu_os: x86_64-win64
            installer: "Lazarus%20Windows%2064%20bits/Lazarus%204.4/lazarus-4.4-fpc-3.2.2-win64.exe"
          - platform: Win32
            cpu_os: i386-win32
            installer: "Lazarus%20Windows%2032%20bits/Lazarus%204.4/lazarus-4.4-fpc-3.2.2-win32.exe"
    defaults:
      run:
        working-directory: Delphi/DeviceSetup
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Restore cached Lazarus
        id: lazcache
        uses: actions/cache@v4
        with:
          path: C:\lazarus
          key: lazarus-4.4-${{ matrix.platform }}-v2

      - name: Install Lazarus 4.4 (first run only)
        if: steps.lazcache.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $url = "https://downloads.sourceforge.net/project/lazarus/${{ matrix.installer }}"
          curl.exe -L --fail --retry 5 --retry-delay 5 -o lazarus-setup.exe $url
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::Lazarus download failed"; exit 1 }
          Start-Process -Wait -FilePath .\lazarus-setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/DIR=C:\lazarus'
          if (-not (Test-Path C:\lazarus\lazbuild.exe)) { Write-Output "::error::lazbuild.exe not found after install"; exit 1 }

      - name: Generate .lfm forms from .dfm
        shell: pwsh
        run: python tools/dfm2lfm.py

      - name: Compile
        shell: pwsh
        run: |
          & C:\lazarus\lazbuild.exe --build-all --lazarusdir=C:\lazarus DeviceSetup.lpi *>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            # surface compiler errors as annotations
            Select-String -Path build.log -Pattern 'Error|Fatal' | Select-Object -First 20 | ForEach-Object { Write-Output "::error::$($_.Line)" }
            exit 1
          }
          $exe = "lazbuild-out\${{ matrix.cpu_os }}\DeviceSetup.exe"
          if (-not (Test-Path $exe)) { Write-Error "EXE not produced: $exe"; exit 1 }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item $exe "artifacts\DeviceSetup-${{ matrix.platform }}.exe"
          Get-Item "artifacts\*.exe" | Format-Table Name, Length

      - name: Self test both forms
        shell: pwsh
        run: |
          # The compiler cannot see form-streaming problems: a component that
          # exists in the .lfm but not in the form class only fails when the
          # form is created. /selftest builds MAIN 1 *and* MAIN 2 and exits
          # non-zero if anything goes wrong.
          $exe = Join-Path (Get-Location) "artifacts\DeviceSetup-${{ matrix.platform }}.exe"
          if (-not (Test-Path $exe)) { Write-Output "::error::EXE not found: $exe"; exit 1 }
          $proc = Start-Process -FilePath $exe -ArgumentList '/selftest' -PassThru -Wait
          if ($proc.ExitCode -ne 0) {
            $logdir = Join-Path $env:APPDATA 'MobileServicingTools\logs'
            Get-ChildItem -Path $logdir -Filter 'error-*.txt' -ErrorAction SilentlyContinue |
              ForEach-Object { Get-Content $_.FullName | ForEach-Object { Write-Output "::error::$_" } }
            Write-Output "::error::Self test failed with exit code $($proc.ExitCode)"
            exit 1
          }
          Write-Output 'Self test passed: both forms stream and the catalog loads.'

      - name: Smoke test the EXE
        shell: pwsh
        run: |
          # Then make sure the real start-up path (message loop, device watcher)
          # keeps running instead of dying on the way in.
          $exe = Join-Path (Get-Location) "artifacts\DeviceSetup-${{ matrix.platform }}.exe"
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 10
          $proc.Refresh()
          if ($proc.HasExited) {
            Write-Output "::error::The app exited during start-up (code $($proc.ExitCode))"
            exit 1
          }
          Write-Output "Started and stayed running (PID $($proc.Id)); closing it."
          Stop-Process -Id $proc.Id -Force

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: DeviceSetup-${{ matrix.platform }}-${{ github.sha }}
          path: Delphi/DeviceSetup/artifacts/*.exe
          if-no-files-found: error
          retention-days: 30
