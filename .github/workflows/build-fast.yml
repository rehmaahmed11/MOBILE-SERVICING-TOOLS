name: Build EXEs (fast)

# Builds the app on GitHub-hosted Windows runners with the free Lazarus /
# Free Pascal compiler - no self-hosted runner or Delphi licence needed.
# Lazarus is cached after the first run, so later runs only compile.
# Every build compiles an installer from the verified portable bundle, silently
# installs it, then runs "DeviceSetup.exe --selftest" from the installed layout.
# Releases contain both the installer and portable ZIP with the full support tree.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      screenshots:
        description: 'Also publish self-test screenshots as check runs (for review without downloading artifacts)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Win64
            cpu_os: x86_64-win64
            installer: "Lazarus%20Windows%2064%20bits/Lazarus%204.4/lazarus-4.4-fpc-3.2.2-win64.exe"
          - platform: Win32
            cpu_os: i386-win32
            installer: "Lazarus%20Windows%2032%20bits/Lazarus%204.4/lazarus-4.4-fpc-3.2.2-win32.exe"
    defaults:
      run:
        working-directory: Delphi/DeviceSetup
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Restore cached Lazarus
        id: lazcache
        uses: actions/cache@v4
        with:
          path: C:\lazarus
          key: lazarus-4.4-${{ matrix.platform }}-v2

      - name: Install Lazarus 4.4 (first run only)
        if: steps.lazcache.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $url = "https://downloads.sourceforge.net/project/lazarus/${{ matrix.installer }}"
          curl.exe -L --fail --retry 5 --retry-delay 5 -o lazarus-setup.exe $url
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::Lazarus download failed"; exit 1 }
          Start-Process -Wait -FilePath .\lazarus-setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/DIR=C:\lazarus'
          if (-not (Test-Path C:\lazarus\lazbuild.exe)) { Write-Output "::error::lazbuild.exe not found after install"; exit 1 }

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          $programFilesX86 = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          $candidate = Join-Path $programFilesX86 'Inno Setup 6\ISCC.exe'
          if ($iscc) {
            $isccPath = $iscc.Source
          } elseif (Test-Path $candidate) {
            $isccPath = $candidate
          } else {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $isccPath = $candidate
          }
          if (-not (Test-Path $isccPath)) { Write-Error "ISCC.exe not found: $isccPath"; exit 1 }
          "ISCC_PATH=$isccPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output "Using Inno Setup compiler: $isccPath"

      - name: Check Pascal source structure
        # Runs before anything is installed or compiled: a unit that does not
        # balance its begin/end, leaves a comment open, or calls a routine it
        # never declares would otherwise only show up as a Lazarus error at
        # the end of a several-minute Windows build.
        shell: pwsh
        run: python tools/test_pascal_syntax.py

      - name: Generate .lfm forms from .dfm
        shell: pwsh
        run: python tools/dfm2lfm.py

      - name: Check UI layout and embedded artwork contracts
        shell: pwsh
        run: |
          python tools/make_ui_resources.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_ui_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_da_integration.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stamp build id (shown in Help)
        shell: pwsh
        run: |
          $id = "${{ github.sha }}".Substring(0, 7) + " #${{ github.run_number }}"
          Set-Content -Path BuildInfo.inc -Value "CAppBuild = '$id';" -Encoding ascii
          Get-Content BuildInfo.inc

      - name: Compile
        shell: pwsh
        run: |
          & C:\lazarus\lazbuild.exe --build-all --lazarusdir=C:\lazarus DeviceSetup.lpi *>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            # Compiler diagnostics only, and all of them in ONE annotation.
            # The old pattern was 'Error|Fatal', which also matched FPC
            # warnings whose text contains the word "error" - one bad typed
            # constant produced hundreds of "range check error while
            # evaluating constants" lines and pushed the actual error past
            # GitHub's 10-annotation-per-run limit, where it could not be
            # read at all by an environment that cannot reach the job-log
            # host. '\) (Error|Fatal):' only matches real diagnostics.
            $diag = Select-String -Path build.log -Pattern '\) (Error|Fatal):' | ForEach-Object { $_.Line } | Select-Object -Unique
            if (-not $diag) {
              $diag = Select-String -Path build.log -Pattern 'Error|Fatal' | ForEach-Object { $_.Line } | Select-Object -Unique -First 20
            }
            $joined = ($diag | Select-Object -First 80) -join '%0A'
            Write-Output "::error title=fpc-diagnostics ($($diag.Count) line(s))::$joined"
            exit 1
          }
          $exe = "lazbuild-out\${{ matrix.cpu_os }}\DeviceSetup.exe"
          if (-not (Test-Path $exe)) { Write-Error "EXE not produced: $exe"; exit 1 }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item $exe "artifacts\DeviceSetup-${{ matrix.platform }}.exe"
          Get-Item "artifacts\*.exe" | Format-Table Name, Length

      - name: Assemble portable bundle with verified support data
        shell: pwsh
        run: |
          python tools/package_app.py `
            --exe "artifacts/DeviceSetup-${{ matrix.platform }}.exe" `
            --output "artifacts/package" `
            --archive "artifacts/DeviceSetup-${{ matrix.platform }}.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          python tools/build_installer.py --iscc "$env:ISCC_PATH" --platform "${{ matrix.platform }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item "artifacts\DeviceSetup-Setup-${{ matrix.platform }}.exe" | Format-Table Name, Length

      - name: Self-test installed layout, real data and UI
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP "device-setup-install-${{ matrix.platform }}"
          $installer = "artifacts\DeviceSetup-Setup-${{ matrix.platform }}.exe"
          New-Item -ItemType Directory -Force $installRoot | Out-Null
          $dirArg = '/DIR="' + $installRoot + '"'
          $setup = Start-Process -FilePath $installer `
            -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',$dirArg) `
            -PassThru -Wait
          if ($setup.ExitCode -ne 0) { Write-Error "Installer failed: $($setup.ExitCode)"; exit 1 }
          python tools/package_app.py --verify-bundle "$installRoot"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          New-Item -ItemType Directory -Force selftest-run | Out-Null
          $p = Start-Process -FilePath "$installRoot\DeviceSetup.exe" `
            -ArgumentList '--selftest' -WorkingDirectory $installRoot -PassThru
          $null = $p.Handle
          $timedOut = -not $p.WaitForExit(120000)
          New-Item -ItemType Directory -Force selftest-run\selftest | Out-Null
          if (Test-Path "$installRoot\selftest") {
            Copy-Item -Recurse -Force "$installRoot\selftest\*" selftest-run\selftest
          }
          Add-Type -AssemblyName System.Drawing, System.Windows.Forms
          if ($timedOut) {
            # something (usually an error dialog) blocked the app: grab the screen
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $shot = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($shot).CopyFromScreen($b.Left, $b.Top, 0, 0, $shot.Size)
            $shot.Save("$PWD\selftest-run\selftest\timeout-screen.png")
            # text of the blocking window(s), e.g. an error message box
            $src = 'using System; using System.Text; using System.Runtime.InteropServices;
            public static class Wnd {
              public delegate bool EnumProc(IntPtr h, IntPtr l);
              [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc f, IntPtr l);
              [DllImport("user32.dll")] public static extern bool EnumChildWindows(IntPtr p, EnumProc f, IntPtr l);
              [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
              [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
              [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
              public static string Dump(uint pid) {
                var sb = new StringBuilder();
                EnumWindows((h, l) => { uint p; GetWindowThreadProcessId(h, out p);
                  if (p == pid && IsWindowVisible(h)) {
                    var t = new StringBuilder(1024); GetWindowText(h, t, 1024); sb.Append("[" + t + "] ");
                    EnumChildWindows(h, (c, l2) => { var ct = new StringBuilder(4096); GetWindowText(c, ct, 4096); if (ct.Length > 0) sb.Append(ct + " | "); return true; }, IntPtr.Zero);
                    sb.Append(" || "); }
                  return true; }, IntPtr.Zero);
                return sb.ToString(); } }'
            Add-Type -TypeDefinition $src
            $txt = [Wnd]::Dump([uint32]$p.Id) -replace "`r", '' -replace "`n", '%0A'
            Write-Output "::notice title=blocking-window-${{ matrix.platform }}::$txt"
            Stop-Process -Id $p.Id -Force
          }
          Get-ChildItem selftest-run\selftest\*.bmp -ErrorAction SilentlyContinue | ForEach-Object {
            $img = [System.Drawing.Image]::FromFile($_.FullName)
            $img.Save(($_.FullName -replace '\.bmp$', '.png'), [System.Drawing.Imaging.ImageFormat]::Png)
            $img.Dispose()
            Remove-Item $_.FullName
          }
          $log = 'selftest-run\selftest\selftest.log'
          if (Test-Path $log) { Get-Content $log }
          if ($timedOut) { Write-Output "::error::Self-test did not finish (probably blocked by an error dialog - see timeout-screen.png)"; exit 1 }
          if (($p.ExitCode -ne 0) -or -not (Test-Path $log) -or -not (Select-String -Path $log -Pattern 'SELFTEST OK' -Quiet)) {
            Write-Output "::error::Self-test failed (exit code $($p.ExitCode))"
            exit 1
          }

      - name: Report self-test as annotations
        if: always()
        shell: pwsh
        env:
          GH_WANT_SHOTS: ${{ inputs.screenshots }}
          GH_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          $dir = 'selftest-run\selftest'
          $log = "$dir\selftest.log"
          if (Test-Path $log) {
            $text = (Get-Content $log) -join '%0A'
            Write-Output "::notice title=selftest-${{ matrix.platform }}::$text"
          } else {
            Write-Output "::notice title=selftest-${{ matrix.platform }}::no selftest.log"
          }
          # Screenshots as neutral check runs (lossless base64 PNG chunks, readable
          # through the GitHub API) so the screens can be reviewed without
          # downloading artifacts. They are published for every pull request,
          # for manual runs with "screenshots" ticked, and for any commit that
          # contains the marker file .github/ci-screenshots (useful on main).
          $wantShots = ($env:GH_WANT_SHOTS -eq 'true') -or ($env:GH_PR -eq 'true') -or (Test-Path '../../.github/ci-screenshots')
          if (('${{ matrix.platform }}' -eq 'Win64') -and $wantShots) {
            $env:GH_TOKEN = '${{ github.token }}'
            $sha = '${{ github.event.pull_request.head.sha || github.sha }}'
            Add-Type -AssemblyName System.Drawing
            Get-ChildItem "$dir\*.png" -ErrorAction SilentlyContinue | ForEach-Object {
              # Do not quantize to GIF: its 256-colour palette introduced
              # dithering that obscured the actual font and background colours.
              $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($_.FullName))
              $size = 60000
              $n = [Math]::Ceiling($b64.Length / $size)
              for ($i = 0; $i -lt $n; $i++) {
                $chunk = $b64.Substring($i * $size, [Math]::Min($size, $b64.Length - $i * $size))
                $body = @{ name = "ci-shot $($_.BaseName) $($i + 1)/$n"; head_sha = $sha; status = 'completed'; conclusion = 'neutral';
                           output = @{ title = 'self-test screenshot'; summary = 'base64 PNG chunk'; text = $chunk } } | ConvertTo-Json -Depth 4
                $body | gh api "repos/${{ github.repository }}/check-runs" --input - --silent
              }
            }
          }

      - name: Upload self-test results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DeviceSetup-selftest-${{ matrix.platform }}-${{ github.sha }}
          path: Delphi/DeviceSetup/selftest-run/selftest/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload portable bundle and installer
        uses: actions/upload-artifact@v4
        with:
          name: DeviceSetup-${{ matrix.platform }}-${{ github.sha }}
          path: |
            Delphi/DeviceSetup/artifacts/DeviceSetup-${{ matrix.platform }}.zip
            Delphi/DeviceSetup/artifacts/DeviceSetup-Setup-${{ matrix.platform }}.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers and portable bundles
        uses: actions/download-artifact@v4
        with:
          pattern: DeviceSetup-Win*-${{ github.sha }}
          merge-multiple: true
          path: exe

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l exe
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            gh release create "$tag" exe/*.zip exe/*.exe --verify-tag \
              --title "Mobile Servicing Tools $tag" --generate-notes
          else
            gh release delete latest-build --yes --cleanup-tag 2>/dev/null || true
            gh release create latest-build exe/*.zip exe/*.exe --target "$GITHUB_SHA" --latest \
              --title "Latest build (main)" \
              --notes "Built from ${GITHUB_SHA::7} on main. Install with DeviceSetup-Setup-Win64.exe (64-bit) or DeviceSetup-Setup-Win32.exe (32-bit), or use the portable ZIP bundles. The installer puts DeviceSetup.exe at the install root and preserves the complete Data and libusb support tree. This release is replaced on every push to main."
          fi
