name: Build EXEs (fast)

# Builds the app on GitHub-hosted Windows runners with the free Lazarus /
# Free Pascal compiler - no self-hosted runner or Delphi licence needed.
# Lazarus is cached after the first run, so later runs only compile.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Win64
            choco_args: ""
            cpu_os: x86_64-win64
          - platform: Win32
            choco_args: "--x86"
            cpu_os: i386-win32
    defaults:
      run:
        working-directory: Delphi/DeviceSetup
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Restore cached Lazarus
        id: lazcache
        uses: actions/cache@v4
        with:
          path: C:\lazarus
          key: lazarus-choco-${{ matrix.platform }}-v1

      - name: Install Lazarus (first run only)
        if: steps.lazcache.outputs.cache-hit != 'true'
        shell: pwsh
        run: choco install lazarus ${{ matrix.choco_args }} -y --no-progress

      - name: Generate .lfm forms from .dfm
        shell: pwsh
        run: python tools/dfm2lfm.py

      - name: Compile
        shell: pwsh
        run: |
          & C:\lazarus\lazbuild.exe --build-all --lazarusdir=C:\lazarus DeviceSetup.lpi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = "lazbuild-out\${{ matrix.cpu_os }}\DeviceSetup.exe"
          if (-not (Test-Path $exe)) { Write-Error "EXE not produced: $exe"; exit 1 }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item $exe "artifacts\DeviceSetup-${{ matrix.platform }}.exe"
          Get-Item "artifacts\*.exe" | Format-Table Name, Length

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: DeviceSetup-${{ matrix.platform }}-${{ github.sha }}
          path: Delphi/DeviceSetup/artifacts/*.exe
          if-no-files-found: error
          retention-days: 30
